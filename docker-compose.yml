services:
  backend:
    build: ./backend
    # .env is optional; without it the defaults apply.
    env_file:
      - path: .env
        required: false
    environment:
      # "localhost" in a container is the container, so reach a local Ollama via the host.
      LLM_BASE_URL: ${DOCKER_LLM_BASE_URL:-${LLM_BASE_URL:-http://host.docker.internal:11434/v1}}
    extra_hosts:
      - "host.docker.internal:host-gateway"  # needed on Linux; built in on Docker Desktop
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      # Use FRONTEND_PORT=80 on a server.
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
