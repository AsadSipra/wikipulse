services:
  backend:
    build: ./backend
    # Every setting in .env reaches the backend (AI_ENABLED, budgets, WIKIPEDIA_ONLY, ...),
    # so the container behaves like a local run. .env is optional: defaults apply without it.
    env_file:
      - path: .env
        required: false
    environment:
      # Inside the container "localhost" is the container itself, so a local Ollama
      # must be reached through the host. DOCKER_LLM_BASE_URL overrides this;
      # otherwise LLM_BASE_URL from .env is used, then the host's Ollama.
      LLM_BASE_URL: ${DOCKER_LLM_BASE_URL:-${LLM_BASE_URL:-http://host.docker.internal:11434/v1}}
    extra_hosts:
      - "host.docker.internal:host-gateway"  # needed on Linux; built in on Docker Desktop
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      # 8080 locally; set FRONTEND_PORT=80 on a server so the plain IP works.
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
