[project]
name = "wikipulse-backend"
version = "0.1.0"
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
# Make `import app` work with plain `pytest`, not only `python -m pytest`.
pythonpath = ["."]

[tool.ruff]
line-length = 110
